name: CI

# The authoritative gate. Until this existed, the test suites ran ONLY inside
# publish.yml — that is, at release time, after the code was already merged.
# A regression could sit on main indefinitely and would first be noticed by
# whoever published next.
#
# The local .githooks/pre-commit hook runs the same commands, but it validates
# the working tree and is bypassable with --no-verify. This runs against the
# real commit, on a clean machine, and is not bypassable.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and check for stale bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # The plugins declare the harness packages as PEERS and ship no copies of
      # their own, so nothing resolves until they are anchored at a real dsh
      # install. Same requirement as a developer machine — see
      # scripts/anchor.mjs. Mirrors the setup in publish.yml.
      - name: Install the harness and anchor peers
        run: |
          npm i -g @deepseek-ai/dsh
          node scripts/anchor.mjs

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # The harness loads lib/, not src/, and those bundles are committed. If
      # the build just produced something different from what is in the tree,
      # the commit ships a package whose published code is not the code that
      # was reviewed. .gitattributes pins every text file to LF, so this
      # comparison is stable between a Windows checkout and this runner.
      - name: Committed bundles match their sources
        run: |
          if ! git diff --exit-code --stat; then
            echo ""
            echo "::error::Committed bundles are stale — rebuild and commit lib/."
            echo "Run 'pnpm run build' locally and stage the regenerated files."
            exit 1
          fi
