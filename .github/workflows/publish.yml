name: Publish to npm

# Publishes every package under plugins/ that is not already on npm at its
# current version, so a re-run after a partial failure is safe.
#
# Requires an NPM_TOKEN secret on THIS repository — Actions secrets are
# write-only and cannot be shared between user-account repos, so a token set on
# another repo is not visible here.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (default: latest)'
        required: false
        default: 'latest'
      dry-run:
        description: 'Resolve and pack, but do not publish'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # The plugins declare the harness packages as PEERS and ship no copies of
      # their own, so the tests and typecheck cannot resolve @deepseek-ai/*
      # until they are anchored at a real dsh install. Same requirement as a
      # developer machine — see scripts/anchor.mjs.
      - name: Install the harness and anchor peers
        run: |
          npm i -g @deepseek-ai/dsh
          node scripts/anchor.mjs

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Verify against the installed dsh
        run: node scripts/verify.mjs

      # A release tag must match the version being published, or it is unclear
      # what the tag actually points at. All packages share a version here.
      - name: Check release tag matches package versions
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          fail=0
          for dir in plugins/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ "v$version" != "$TAG" ]; then
              echo "::error::$name is $version but the release tag is $TAG"
              fail=1
            fi
          done
          exit $fail

      # Fail before touching the registry, not partway through five packages.
      # A run that authenticates for the first package and dies on the third
      # leaves a half-published release, and npm publishes are effectively
      # permanent. An empty secret is the likely cause: GitHub renders a set
      # secret as *** in logs, so a blank NODE_AUTH_TOKEN means the value itself
      # is empty, not that masking hid it.
      - name: Check the npm token before publishing anything
        if: github.event.inputs.dry-run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is unset or empty on this repository."
            echo "Set it with:  gh secret set NPM_TOKEN --repo ${{ github.repository }}"
            echo "Actions secrets are write-only, so an existing one cannot be inspected —"
            echo "if it is already listed, re-set it; the stored value is empty."
            exit 1
          fi
          if ! whoami_out=$(npm whoami 2>&1); then
            echo "::error::npm rejected the token: ${whoami_out}"
            echo "It may be expired, revoked, or read-only. Publishing needs a granular"
            echo "access token with write access to the @dennisrongo scope AND its"
            echo "\"Bypass 2FA\" option enabled — see the EOTP note below."
            exit 1
          fi
          echo "authenticated to npm as ${whoami_out}"

          # Authenticating is not the same as being allowed to write. Legacy
          # classic tokens were removed in November 2025, so this is a granular
          # access token — and a granular token only skips the OTP prompt when
          # its "Bypass 2FA" option was enabled AT CREATION. Without it, publish
          # fails with EOTP even though `npm whoami` succeeds, which is exactly
          # what happened here. The option cannot be added later; regenerate the
          # token. Report the 2FA mode so the next failure is diagnosable. Only
          # the tfa field is printed — `npm profile get` also emits the account
          # email, and this log is public.
          if profile_json=$(npm profile get --json 2>/dev/null); then
            node -e '
              const p = JSON.parse(process.argv[1]);
              const tfa = p.tfa;
              const mode = tfa === null || tfa === undefined ? "disabled"
                : typeof tfa === "string" ? tfa
                : (tfa.mode ?? JSON.stringify(tfa));
              console.log(`npm account 2FA mode: ${mode}`);
              if (String(mode).includes("auth-and-writes")) {
                console.log("  writes require 2FA — the granular token must have");
                console.log("  \"Bypass 2FA\" enabled, which is set only at creation time.");
              }
            ' "$profile_json"
          else
            echo "could not read the npm profile (granular tokens may not permit it) — continuing"
          fi

      - name: Publish each package not already on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.event.inputs.tag || 'latest' }}
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          published=0
          skipped=0
          for dir in plugins/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip    $name@$version is already published"
              skipped=$((skipped+1))
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "dry-run $name@$version would publish"
              ( cd "$dir" && npm pack --dry-run )
              continue
            fi
            echo "publish $name@$version"
            ( cd "$dir" && npm publish --provenance --access public --tag "$DIST_TAG" )
            published=$((published+1))
          done
          echo "published=$published skipped=$skipped"
