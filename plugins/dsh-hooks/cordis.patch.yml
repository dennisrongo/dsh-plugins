# dsh bundle patch: inserts this plugin into a profile's layer stack, so
# `dsh plugin add` mounts it without hand-editing the profile's own
# cordis.patch.yml. Both id: and name: are required — a bare id: is an
# id-targeted override of an existing row and silently no-ops.
#
# Deliberately carries no config. Every hook lives in the `dsh-hooks` settings
# namespace ($DSH_HOME/settings.yaml) or in <workspace>/.dsh/hooks.json, so a
# profile never has to be edited to change a hook. To turn the whole plugin off
# without uninstalling it, set `enabled: false` in the settings namespace.
- insert:
    - id: dsh-hooks
      name: '@dennisrongo/dsh-hooks'
